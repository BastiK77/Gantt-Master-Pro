<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Gantt Master Pro: Persistent ID-Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; display: flex; flex-direction: column; }
        .controls { padding: 12px 20px; background: #2c3e50; display: flex; justify-content: center; gap: 12px; color: white; align-items: center; z-index: 1000; position: relative; }
        #view-container { position: relative; width: 100vw; height: calc(100vh - 65px); overflow-y: auto; background: #fff; }
        canvas { display: none; position: absolute; top: 0; left: 0; cursor: crosshair; }
        canvas.active { display: block; }
        .btn { padding: 8px 16px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; font-weight: bold; }
        .btn-add { background: #27ae60; }
        .btn-tour { background: #8e44ad; }
        .btn-danger { background: #e74c3c; }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: white; border-radius: 8px; width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; }
        .tab-header { display: flex; background: #ecf0f1; border-bottom: 1px solid #ccc; }
        .tab-btn { flex: 1; padding: 12px; border: none; cursor: pointer; background: none; font-weight: bold; color: #7f8c8d; }
        .tab-btn.active { background: white; color: #2c3e50; border-bottom: 2px solid #3498db; }
        .tab-content { padding: 20px; display: none; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }
        .footer { padding: 15px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="modal-overlay"><div class="modal" id="modal-box"></div></div>

<div class="controls">
    <button class="btn" onclick="switchView('MONTH')">Jahr</button>
    <button class="btn" onclick="switchView('DAY')">Monat</button>
    <button class="btn btn-tour" onclick="switchView('TOUR')">Touren-Ansicht</button>
    <div style="display:flex; align-items: center; gap: 10px; margin: 0 15px;">
        <button class="btn" onclick="navTime(-1)">&#10094;</button>
        <span id="period-display" style="min-width:150px; text-align:center; font-weight:bold;"></span>
        <button class="btn" onclick="navTime(1)">&#10095;</button>
    </div>
    <button class="btn btn-add" onclick="addResourceTop()">+ Ressource</button>
</div>

<div id="view-container">
    <div id="scroll-spacer"></div>
    <canvas id="canvasStandard"></canvas>
    <canvas id="canvasTour"></canvas>
</div>

<script>
/**
 * 1. DATENVERWALTUNG & LOCALSTORAGE
 */
const COLORS = { projekt: "#3498db", wartung: "#95a5a6", urlaub: "#2ecc71", service: "#9b59b6" };
const config = { headerW: 240, rowH: 45, topM: 60, monthNames: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'], dayNamesShort: ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'] };

let techs = JSON.parse(localStorage.getItem('gantt_techs')) || [{ id: 1, name: "TEAM NORD", parentId: null }];
let tasks = (JSON.parse(localStorage.getItem('gantt_tasks')) || []).map(t => ({ ...t, start: new Date(t.start), end: new Date(t.end) }));

function saveData() {
    localStorage.setItem('gantt_techs', JSON.stringify(techs));
    localStorage.setItem('gantt_tasks', JSON.stringify(tasks));
}

let viewMode = 'MONTH', currentYear = 2024, currentMonth = 4, tourDate = new Date(2024, 4, 10);
let scrollTop = 0, activeTask = null, editingObj = null, isNew = false, isDragging = false, isResizingEnd = false, isResizingStart = false, mouseDownTime = 0;

const cStd = document.getElementById('canvasStandard');
const cTour = document.getElementById('canvasTour');
const spacer = document.getElementById('scroll-spacer');

/**
 * 2. ENGINES
 */
const StandardEngine = {
    dateToX: (date) => {
        const units = viewMode === 'MONTH' ? 12 : new Date(currentYear, currentMonth + 1, 0).getDate();
        const unitW = (cStd.width - config.headerW) / units;
        const dStart = viewMode === 'MONTH' ? new Date(currentYear, 0, 1) : new Date(currentYear, currentMonth, 1);
        const div = viewMode === 'MONTH' ? 30.44 : 1;
        return config.headerW + ((date - dStart) / 86400000 / div) * unitW;
    },
    xToDate: (x) => {
        const units = viewMode === 'MONTH' ? 12 : 31;
        const mult = viewMode === 'MONTH' ? 30.44 : 1;
        const dStart = viewMode === 'MONTH' ? new Date(currentYear, 0, 1) : new Date(currentYear, currentMonth, 1);
        const unitW = (cStd.width - config.headerW) / units;
        return new Date(dStart.getTime() + (x - config.headerW) / unitW * mult * 86400000);
    }
};

const TourEngine = {
    dateToX: (date, isEnd = false) => {
        const unitW = (cTour.width - config.headerW) / 3;
        let d = new Date(date); d.setHours(0,0,0,0);
        if(isEnd) d.setDate(d.getDate() + 1);
        return config.headerW + ((d - tourDate.getTime()) / 86400000) * unitW;
    },
    xToDate: (x) => {
        const unitW = (cTour.width - config.headerW) / 3;
        const days = Math.floor((x - config.headerW) / unitW);
        let d = new Date(tourDate); d.setDate(d.getDate() + days);
        d.setHours(8, 0, 0, 0);
        return d;
    }
};

/**
 * 3. CORE LOGIK (ID-BASIERT)
 */
function calculateStacking() {
    const isTour = viewMode === 'TOUR';
    techs.forEach(res => { res.slots = 1; });
    tasks.forEach(t => t.slot = 0);

    techs.forEach((res) => {
        let resTasks = tasks.filter(t => t.resId === res.id).sort((a,b) => a.start - b.start);
        let slots = [];
        resTasks.forEach(t => {
            let placed = false;
            let startComp = isTour ? new Date(t.start).setHours(0,0,0,0) : t.start.getTime();
            for(let i=0; i<slots.length; i++) {
                if (slots[i] <= startComp) {
                    t.slot = i;
                    slots[i] = isTour ? new Date(t.end).setHours(23,59,59) : t.end.getTime();
                    placed = true; break;
                }
            }
            if(!placed) { t.slot = slots.length; slots.push(isTour ? new Date(t.end).setHours(23,59,59) : t.end.getTime()); }
        });
        res.slots = Math.max(1, slots.length);
    });
}

function getY(idx) { let y = 0; for(let i=0; i<idx; i++) y += (techs[i].slots || 1) * config.rowH; return y; }

/**
 * 4. RENDERING
 */
function draw() {
    calculateStacking();
    const activeCanvas = viewMode === 'TOUR' ? cTour : cStd;
    const ctx = activeCanvas.getContext('2d');
    const engine = viewMode === 'TOUR' ? TourEngine : StandardEngine;
    const units = viewMode === 'TOUR' ? 3 : (viewMode === 'MONTH' ? 12 : new Date(currentYear, currentMonth + 1, 0).getDate());
    const unitW = (activeCanvas.width - config.headerW) / units;
    const totalH = getY(techs.length);
    spacer.style.height = (totalH + config.topM) + "px";

    ctx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
    ctx.save(); ctx.translate(0, config.topM - scrollTop);
    
    // Grid & Weekends
    for(let i=0; i<=units; i++) {
        let x = config.headerW + i * unitW;
        let d = viewMode === 'TOUR' ? new Date(tourDate.getTime() + i*86400000) : new Date(currentYear, currentMonth, i+1);
        if((viewMode === 'DAY' || viewMode === 'TOUR') && (d.getDay() === 0 || d.getDay() === 6)) {
            ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(x, 0, unitW, totalH);
        }
        ctx.strokeStyle = "#eee"; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, totalH); ctx.stroke();
    }

    // Resources
    techs.forEach((res, i) => {
        let y = getY(i), h = res.slots * config.rowH;
        ctx.fillStyle = i%2===0 ? "#fff" : "#fcfcfc"; ctx.fillRect(0, y, activeCanvas.width, h);
        ctx.strokeStyle = "#eee"; ctx.strokeRect(0, y, config.headerW, h);
        if (res.parentId !== null) {
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 2; ctx.beginPath();
            let parentIdx = techs.findIndex(t => t.id === res.parentId);
            if(parentIdx !== -1) {
                ctx.moveTo(20, getY(parentIdx)+22); ctx.lineTo(20, y+22); ctx.lineTo(35, y+22); ctx.stroke();
            }
            ctx.lineWidth = 1;
        }
        ctx.fillStyle = "#333"; ctx.font = "bold 12px sans-serif"; ctx.fillText(res.name, res.parentId?45:15, y+28);
    });

    // Tasks
    tasks.forEach(t => {
        let resIdx = techs.findIndex(r => r.id === t.resId);
        if(resIdx === -1) return;
        let x1 = engine.dateToX(t.start), x2 = engine.dateToX(t.end, true);
        let y = getY(resIdx) + (t.slot * config.rowH) + 10;
        if(x2 < config.headerW || x1 > activeCanvas.width) return;
        ctx.fillStyle = (t === activeTask) ? "#e67e22" : (COLORS[t.type] || "#3498db");
        const drawX = Math.max(config.headerW, x1), drawW = Math.max(5, x2 - drawX);
        ctx.fillRect(drawX, y, drawW, config.rowH - 20);
        if(drawW > 20) {
            ctx.fillStyle = "white"; ctx.font = "bold 10px sans-serif";
            let timeLabel = t.start.getHours()+":"+t.start.getMinutes().toString().padStart(2,'0');
            ctx.fillText((viewMode === 'TOUR' ? timeLabel + " " : "") + t.label, drawX+5, y+18);
        }
    });
    ctx.restore();

    // FIXED HEADER
    ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, 0, activeCanvas.width, config.topM);
    ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif"; ctx.fillText("RESSOURCEN", 15, 35);
    for(let i=0; i<units; i++) {
        let x = config.headerW + i * unitW;
        let d = viewMode === 'TOUR' ? new Date(tourDate.getTime() + i*86400000) : new Date(currentYear, currentMonth, i+1);
        ctx.fillStyle = "#ecf0f1";
        if (viewMode === 'MONTH') {
            ctx.font = "bold 11px sans-serif"; ctx.fillText(config.monthNames[i], x + 10, 35);
        } else {
            ctx.font = "9px sans-serif"; ctx.fillText(config.dayNamesShort[d.getDay()], x+8, 22);
            ctx.font = "bold 11px sans-serif"; ctx.fillText((viewMode==='TOUR' ? d.getDate()+"."+(d.getMonth()+1)+"." : d.getDate()+"."), x+8, 42);
        }
        ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.strokeRect(x, 0, unitW, config.topM);
    }
}

/**
 * 5. INTERAKTION (ID-BASIERT)
 */
function handleMouseDown(e) {
    const rect = e.target.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top + scrollTop;
    const engine = viewMode === 'TOUR' ? TourEngine : StandardEngine;
    let cY = my - config.topM;
    mouseDownTime = Date.now(); isDragging = isResizingStart = isResizingEnd = isNew = false;

    let resIdx = techs.findIndex((r, i) => cY >= getY(i) && cY < getY(i+1 || 9999));
    let res = techs[resIdx];

    if (mx < config.headerW && my > config.topM && res) { openResModal(resIdx); return; }
    if (e.shiftKey && res && mx > config.headerW) {
        activeTask = { id: Date.now(), start: engine.xToDate(mx), end: new Date(engine.xToDate(mx).getTime() + 7200000), resId: res.id, label: "Neu", type: "projekt" };
        tasks.push(activeTask); isNew = isResizingEnd = true; draw(); return;
    }

    activeTask = tasks.find(t => {
        let rIdx = techs.findIndex(r => r.id === t.resId);
        if(rIdx === -1) return false;
        let y = getY(rIdx) + (t.slot * config.rowH), x1 = engine.dateToX(t.start), x2 = engine.dateToX(t.end, true);
        if (mx >= x1 && mx <= x2 && cY >= y && cY <= y + config.rowH) {
            let pct = (mx - x1) / (x2 - x1);
            if (pct < 0.15) isResizingStart = true; else if (pct > 0.85) isResizingEnd = true; else isDragging = true;
            return true;
        }
    });

    if (activeTask) {
        if(e.ctrlKey) { let c = {...activeTask, id: Date.now(), start: new Date(activeTask.start), end: new Date(activeTask.end)}; tasks.push(c); activeTask = c; }
        activeTask.dragOffset = mx - engine.dateToX(activeTask.start);
    }
}

function handleMouseMove(e) {
    if(!activeTask) return;
    const rect = e.target.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top + scrollTop;
    const engine = viewMode === 'TOUR' ? TourEngine : StandardEngine;
    if (isResizingEnd) activeTask.end = engine.xToDate(mx);
    else if (isResizingStart) activeTask.start = engine.xToDate(mx);
    else if (isDragging) {
        let dur = activeTask.end - activeTask.start;
        activeTask.start = engine.xToDate(mx - activeTask.dragOffset);
        activeTask.end = new Date(activeTask.start.getTime() + dur);
        let resIdx = techs.findIndex((r, i) => (my - config.topM) >= getY(i) && (my - config.topM) < getY(i+1 || 9999));
        if (techs[resIdx]) activeTask.resId = techs[resIdx].id;
    }
    draw();
}

/**
 * 6. MODALS & UI
 */
function openResModal(idx) {
    editingObj = { ...techs[idx], idx };
    const resTasks = tasks.filter(t => t.resId === techs[idx].id);
    document.getElementById('modal-box').innerHTML = `
        <div class="tab-header"><button class="tab-btn active" onclick="showTab('base')">Daten</button><button class="tab-btn" onclick="showTab('team')">Team</button></div>
        <div id="tab-base" class="tab-content active"><label>Name</label><input type="text" id="r-name" value="${techs[idx].name}"></div>
        <div id="tab-team" class="tab-content"><label>Übergeordnetes Team</label><select id="r-parent"><option value="">Kein Team</option>${techs.filter(r => r.id !== techs[idx].id).map(r => `<option value="${r.id}" ${techs[idx].parentId == r.id ? 'selected' : ''}>${r.name}</option>`).join('')}</select></div>
        <div class="footer"><button class="btn btn-danger" onclick="confirmDeleteRes(${idx}, ${resTasks.length})">Löschen</button><button class="btn btn-add" onclick="saveRes()">Speichern</button></div>`;
    document.getElementById('modal-overlay').style.display = 'flex';
}

function confirmDeleteRes(idx, count) {
    if (confirm(count > 0 ? `Achtung: Diese Ressource hat noch ${count} Einsätze. Alles löschen?` : `Ressource löschen?`)) {
        tasks = tasks.filter(t => t.resId !== techs[idx].id);
        techs.splice(idx, 1); saveData(); closeModal(); draw();
    }
}

function saveRes() {
    const res = techs[editingObj.idx];
    res.name = document.getElementById('r-name').value;
    res.parentId = document.getElementById('r-parent').value ? parseInt(document.getElementById('r-parent').value) : null;
    
    // Baum-Sortierung
    let sorted = []; let parents = techs.filter(t => t.parentId === null);
    parents.forEach(p => { sorted.push(p); techs.filter(c => c.parentId === p.id).forEach(c => sorted.push(c)); });
    techs = sorted; 
    saveData(); closeModal(); draw();
}

function openTaskModal(t) {
    editingObj = t; const toIso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    document.getElementById('modal-box').innerHTML = `
        <div class="tab-content active"><h3>Einsatz</h3><label>Name</label><input type="text" id="m-label" value="${t.label}">
        <label>Typ</label><select id="m-type">${Object.keys(COLORS).map(k=>`<option value="${k}" ${t.type===k?'selected':''}>${k}</option>`).join('')}</select>
        <label>Start</label><input type="datetime-local" id="m-start" value="${toIso(t.start)}"><label>Ende</label><input type="datetime-local" id="m-end" value="${toIso(t.end)}"></div>
        <div class="footer"><button class="btn btn-danger" onclick="deleteTask()">Löschen</button><button class="btn" onclick="saveTask()">Speichern</button></div>`;
    document.getElementById('modal-overlay').style.display = 'flex';
}

function saveTask() { editingObj.label = document.getElementById('m-label').value; editingObj.type = document.getElementById('m-type').value; editingObj.start = new Date(document.getElementById('m-start').value); editingObj.end = new Date(document.getElementById('m-end').value); saveData(); closeModal(); draw(); }
function deleteTask() { tasks = tasks.filter(t => t !== editingObj); saveData(); closeModal(); draw(); }
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
function showTab(t) { document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); event.target.classList.add('active'); }

function switchView(m) { viewMode = m; cStd.classList.toggle('active', m !== 'TOUR'); cTour.classList.toggle('active', m === 'TOUR'); updateNav(); draw(); }
function navTime(d) {
    if(viewMode === 'TOUR') tourDate.setDate(tourDate.getDate() + d);
    else if(viewMode === 'MONTH') currentYear += d;
    else { currentMonth += d; if(currentMonth>11){currentMonth=0; currentYear++;} if(currentMonth<0){currentMonth=11; currentYear--;} }
    updateNav(); draw();
}
function updateNav() { document.getElementById('period-display').innerText = viewMode==='TOUR' ? tourDate.toLocaleDateString() : (viewMode==='MONTH' ? currentYear : config.monthNames[currentMonth]+" "+currentYear); }
function addResourceTop() { techs.unshift({ id: Date.now(), name: "Neu", parentId: null }); saveData(); draw(); }

function init() {
    [cStd, cTour].forEach(c => {
        c.width = window.innerWidth; c.height = window.innerHeight;
        c.addEventListener('mousedown', handleMouseDown);
        c.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', () => { if (activeTask && (isNew || Date.now() - mouseDownTime < 200)) openTaskModal(activeTask); activeTask = null; saveData(); draw(); });
    });
    switchView('MONTH');
}

document.getElementById('view-container').addEventListener('scroll', (e) => { scrollTop = e.target.scrollTop; cStd.style.top = cTour.style.top = scrollTop + "px"; draw(); });
window.addEventListener('resize', init);
init();
</script>
</body>
</html>
